info:
  name: 011 Login usuario B
  type: http
  seq: 11
http:
  method: POST
  url: '{{base_url}}/auth/login'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{email_b}}",
        "password": "{{password}}"
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => { expect(res.getStatus()).to.equal(200); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Identidad correcta", () => { expect(res.getBody().user.id).to.equal(Number(bru.getVar("user_b"))); });
      if (res.getStatus() === 200) bru.setVar("token_b", res.getBody().token);
settings:
  encodeUrl: true
