http:
  method: GET
  url: '{{base_url}}/habilidades'
  headers:
  - name: Accept
    value: application/json
  - name: Authorization
    value: Bearer {{token_b}}
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => { expect(res.getStatus()).to.equal(200); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("B conserva solo su tecnología", () => { const d=res.getBody(); expect(d.length).to.equal(1); expect(d[0].tipo).to.equal("tecnologia"); });
