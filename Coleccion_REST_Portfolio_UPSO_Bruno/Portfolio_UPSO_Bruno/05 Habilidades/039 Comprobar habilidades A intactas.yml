info:
  name: 039 Comprobar habilidades A intactas
  type: http
  seq: 39
http:
  method: GET
  url: '{{base_url}}/habilidades'
  headers:
  - name: Accept
    value: application/json
  - name: Authorization
    value: Bearer {{token_a}}
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => { expect(res.getStatus()).to.equal(200); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("A conserva sus habilidades", () => { const d=res.getBody(); expect(d.length).to.equal(2); expect(d.find(x=>x.tipo==="lenguaje").nivel).to.equal("intermedio"); });
settings:
  encodeUrl: true
