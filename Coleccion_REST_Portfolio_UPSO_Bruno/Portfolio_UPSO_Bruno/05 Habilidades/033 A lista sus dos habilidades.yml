info:
  name: 033 A lista sus dos habilidades
  type: http
  seq: 33
http:
  method: GET
  url: '{{base_url}}/habilidades'
  headers:
  - name: Accept
    value: application/json
  - name: Authorization
    value: Bearer {{token_a}}
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => { expect(res.getStatus()).to.equal(200); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Lenguaje y tecnología", () => { const d=res.getBody(); expect(d.length).to.equal(2); expect(d.some(x=>x.tipo==="lenguaje")).to.equal(true); expect(d.some(x=>x.tipo==="tecnologia")).to.equal(true); expect(new Set(d.map(x=>x.tipo+":"+x.elemento_id)).size).to.equal(2); });
settings:
  encodeUrl: true
