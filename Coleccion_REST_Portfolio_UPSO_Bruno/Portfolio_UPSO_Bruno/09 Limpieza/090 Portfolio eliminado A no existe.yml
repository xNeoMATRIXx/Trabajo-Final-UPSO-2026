info:
  name: 090 Portfolio eliminado A no existe
  type: http
  seq: 90
http:
  method: GET
  url: '{{base_url}}/u/{{username_a}}'
  headers:
  - name: Accept
    value: application/json
runtime:
  scripts:
  - type: before-request
    code: |-
      if (String(bru.getEnvVar("limpiar_al_final")).toLowerCase() !== "true") {
        console.warn("OMITIDA limpieza: se conservan las cuentas y portfolios QA de esta ejecución.");
        bru.runner.skipRequest();
      }
  - type: tests
    code: |-
      test("HTTP 404", () => { expect(res.getStatus()).to.equal(404); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Código de error presente", () => { expect(typeof res.getBody().error).to.equal("string"); });
settings:
  encodeUrl: true
