info:
  name: 007 Rechazar modificacion de tecnologias
  type: http
  seq: 7
http:
  method: PUT
  url: '{{base_url}}/tecnologias'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "nombre": "Inventado"
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 405", () => { expect(res.getStatus()).to.equal(405); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Código de error presente", () => { expect(typeof res.getBody().error).to.equal("string"); });
settings:
  encodeUrl: true
