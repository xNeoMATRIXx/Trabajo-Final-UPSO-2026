info:
  name: 075 PUT no permite quitar todos los lenguajes
  type: http
  seq: 75
http:
  method: PUT
  url: '{{base_url}}/proyectos/{{project_a}}'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: Authorization
    value: Bearer {{token_a}}
  body:
    type: json
    data: |-
      {
        "nombre": "Proyecto A {{run_id}}",
        "descripcion": "Proyecto de prueba con varias relaciones",
        "etapa": "implementacion",
        "fecha_deadline": "2030-12-31",
        "fecha_finalizacion": null,
        "lenguajes": [],
        "tecnologias": [
          {{tech1}},
          {{tech2}}
        ],
        "links": [
          {
            "tipo": "repositorio",
            "url": "https://example.com/repo-a"
          },
          {
            "tipo": "repositorio",
            "url": "https://example.com/repo-b"
          },
          {
            "tipo": "demo",
            "url": "https://example.com/demo"
          }
        ]
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 400", () => { expect(res.getStatus()).to.equal(400); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Código de error presente", () => { expect(typeof res.getBody().error).to.equal("string"); });
      test("Error esperado", () => { expect(res.getBody().error).to.equal("lenguajes_requeridos"); });
settings:
  encodeUrl: true
