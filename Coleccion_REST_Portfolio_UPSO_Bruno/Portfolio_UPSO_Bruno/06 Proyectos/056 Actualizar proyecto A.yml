info:
  name: 056 Actualizar proyecto A
  type: http
  seq: 56
http:
  method: PUT
  url: '{{base_url}}/proyectos/{{project_a}}'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: Authorization
    value: Bearer {{token_a}}
  body:
    type: json
    data: |-
      {
        "nombre": "Proyecto A {{run_id}}",
        "descripcion": "Descripción actualizada",
        "etapa": "testing",
        "fecha_deadline": "2030-12-31",
        "fecha_finalizacion": null,
        "lenguajes": [
          {{lang1}},
          {{lang2}}
        ],
        "tecnologias": [
          {{tech1}},
          {{tech2}}
        ],
        "links": [
          {
            "tipo": "repositorio",
            "url": "https://example.com/repo-a"
          },
          {
            "tipo": "repositorio",
            "url": "https://example.com/repo-b"
          },
          {
            "tipo": "demo",
            "url": "https://example.com/demo"
          }
        ]
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => { expect(res.getStatus()).to.equal(200); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      if (res.getStatus() === 200 || res.getStatus() === 201) {
        const p = res.getBody();
        bru.setVar("project_payload_a", JSON.stringify({
          nombre:p.nombre, descripcion:p.descripcion, etapa:p.etapa,
          fecha_deadline:p.fecha_deadline, fecha_finalizacion:p.fecha_finalizacion,
          lenguajes:p.lenguajes.map(x=>x.id), tecnologias:p.tecnologias.map(x=>x.id),
          links:p.links.map(x=>({tipo:x.tipo,url:x.url}))
        }));
        bru.setVar("project_updated_a", p.fecha_actualizacion);
      }
settings:
  encodeUrl: true
