info:
  name: 052 Listar proyectos exclusivos de A
  type: http
  seq: 52
http:
  method: GET
  url: '{{base_url}}/proyectos'
  headers:
  - name: Accept
    value: application/json
  - name: Authorization
    value: Bearer {{token_a}}
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 200", () => { expect(res.getStatus()).to.equal(200); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Aislamiento del listado", () => { const d=res.getBody(); expect(d.length).to.equal(1); expect(d[0].id).to.equal(Number(bru.getVar("project_a"))); expect(d.some(x=>x.id===Number(bru.getVar("project_b")))).to.equal(false); });
settings:
  encodeUrl: true
