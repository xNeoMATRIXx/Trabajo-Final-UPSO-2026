info:
  name: 086 Habilidades sin token
  type: http
  seq: 86
http:
  method: GET
  url: '{{base_url}}/habilidades'
  headers:
  - name: Accept
    value: application/json
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 401", () => { expect(res.getStatus()).to.equal(401); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Código de error presente", () => { expect(typeof res.getBody().error).to.equal("string"); });
      test("Error esperado", () => { expect(res.getBody().error).to.equal("auth_required"); });
settings:
  encodeUrl: true
