info:
  name: 025 Email anterior ya no autentica
  type: http
  seq: 25
http:
  method: POST
  url: '{{base_url}}/auth/login'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{initial_email_a}}",
        "password": "{{password}}"
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 401", () => { expect(res.getStatus()).to.equal(401); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Código de error presente", () => { expect(typeof res.getBody().error).to.equal("string"); });
settings:
  encodeUrl: true
