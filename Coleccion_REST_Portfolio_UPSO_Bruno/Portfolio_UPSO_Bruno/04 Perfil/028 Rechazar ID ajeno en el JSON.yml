info:
  name: 028 Rechazar ID ajeno en el JSON
  type: http
  seq: 28
http:
  method: PUT
  url: '{{base_url}}/auth/me'
  headers:
  - name: Accept
    value: application/json
  - name: Content-Type
    value: application/json
  - name: Authorization
    value: Bearer {{token_a}}
  body:
    type: json
    data: |-
      {
        "email": "{{email_a}}",
        "username": "{{username_a}}",
        "nombre": "{{nombre_a}}",
        "bio": "Biografía actualizada desde Bruno",
        "id": {{user_b}}
      }
runtime:
  scripts:
  - type: tests
    code: |-
      test("HTTP 400", () => { expect(res.getStatus()).to.equal(400); });
      test("Respuesta JSON", () => { expect(String(res.getHeader("content-type"))).to.include("application/json"); });
      test("Código de error presente", () => { expect(typeof res.getBody().error).to.equal("string"); });
      test("Error esperado", () => { expect(res.getBody().error).to.equal("campos_no_permitidos"); });
settings:
  encodeUrl: true
